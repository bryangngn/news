<!DOCTYPE html>
<html lang="es">
<head>
    <title>Mi Dashboard de Noticias</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Raleway">
    <style>
        body,h1,h2,h3,h4,h5,h6 {font-family: "Raleway", sans-serif}
        
        /* Ajuste para scroll independiente por columna como en el original */
        .feed-container { 
            height: 700px; 
            overflow-y: scroll; 
            padding-right: 5px;
        }

        /* Maquetación compacta del ítem: imagen a la izquierda */
        .feed-item {
            display: flex;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

        /* Estilo del Thumbnail cuadrado y uniforme */
        .feed-thumbnail-container {
            flex: 0 0 80px; /* Ancho fijo para la imagen */
            height: 80px;
            margin-right: 12px;
            overflow: hidden;
            border-radius: 4px;
        }

        .feed-thumbnail-container img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Recorta la imagen para llenar el cuadrado */
        }

        /* Contenido de texto a la derecha */
        .feed-content-container {
            flex: 1;
        }

        /* Títulos pequeños como se solicitó */
        .feed-title {
            font-size: 14px;
            font-weight: bold;
            margin: 0 0 4px 0;
            line-height: 1.3;
        }

        /* Enlaces sin subrayado */
        .feed-title a {
            text-decoration: none;
            color: black;
        }
        
        .feed-title a:hover {
            color: #2196F3;
        }

        /* Fecha pequeña y tenue */
        .feed-date {
            font-size: 11px;
            color: #757575;
        }
    </style>
</head>
<body class="w3-light-grey">

<div class="w3-content" style="max-width:1800px">

<header class="w3-container w3-center w3-padding-32"> 
  <h1><b>MIS NOTICIAS</b></h1>
  <p>Actualidad en <span class="w3-tag w3-blue">Ciencia</span> <span class="w3-tag w3-dark-grey">Tecnología</span> <span class="w3-tag w3-red">Videojuegos</span> <span class="w3-tag w3-black">Cine y TV</span></p>
</header>

<div class="w3-row-padding">

  <div class="w3-col l3 m6 w3-margin-bottom">
    <div class="w3-card-4 w3-white">
      <div class="w3-container w3-blue">
        <h3>SINC (Ciencia)</h3>
      </div>
      <div id="ciencia" class="w3-container feed-container">
        <p class="w3-padding">Cargando ciencia...</p>
      </div>
    </div>
  </div>

  <div class="w3-col l3 m6 w3-margin-bottom">
    <div class="w3-card-4 w3-white">
      <div class="w3-container w3-dark-grey">
        <h3>Muy Computer</h3>
      </div>
      <div id="tecnologia" class="w3-container feed-container">
        <p class="w3-padding">Cargando tecnología...</p>
      </div>
    </div>
  </div>

  <div class="w3-col l3 m6 w3-margin-bottom">
    <div class="w3-card-4 w3-white">
      <div class="w3-container w3-red">
        <h3>3D Juegos</h3>
      </div>
      <div id="videojuegos" class="w3-container feed-container">
        <p class="w3-padding">Cargando videojuegos...</p>
      </div>
    </div>
  </div>

  <div class="w3-col l3 m6 w3-margin-bottom">
    <div class="w3-card-4 w3-white">
      <div class="w3-container w3-black">
        <h3>Espinof (Cine)</h3>
      </div>
      <div id="cine" class="w3-container feed-container">
        <p class="w3-padding">Cargando cine y TV...</p>
      </div>
    </div>
  </div>

</div>

<footer class="w3-container w3-dark-grey w3-padding-32 w3-margin-top">
  <p class="w3-center">Adaptado de BryanGNGN - 2024</p>
</footer>

</div>

<script>
/**
 * Función que obtiene el RSS (vía rss2json) y lo inyecta en el HTML
 * con el formato exacto solicitado.
 */
function fetchRSS(url, elementId) {
    // Usamos rss2json para convertir el XML en JSON (soluciona CORS y es más fácil de parsear)
    const api_url = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`;

    fetch(api_url)
        .then(res => res.json())
        .then(data => {
            const container = document.getElementById(elementId);
            if (data.status === 'ok') {
                let itemsHtml = '';
                // rss2json ya devuelve los ítems ordenados por fecha (descendente)
                data.items.forEach(item => {
                    // Intentamos obtener una imagen. rss2json suele extraerla bien.
                    // Si no, usamos una imagen de 'placeholder' o una por defecto.
                    const thumb = item.thumbnail || 'https://via.placeholder.com/80?text=News';
                    
                    itemsHtml += `
                        <div class="feed-item">
                            <div class="feed-thumbnail-container">
                                <img src="${thumb}" alt="noticia">
                            </div>
                            <div class="feed-content-container">
                                <h6 class="feed-title">
                                    <a href="${item.link}" target="_blank">${item.title}</a>
                                </h6>
                                <span class="feed-date">${new Date(item.pubDate).toLocaleDateString('es-ES')}</span>
                            </div>
                        </div>`;
                });
                container.innerHTML = itemsHtml;
            } else {
                container.innerHTML = "<p class='w3-padding'>No se pudo cargar este feed.</p>";
            }
        })
        .catch(err => {
            console.error(err);
            document.getElementById(elementId).innerHTML = "<p class='w3-padding'>Error de conexión.</p>";
        });
}

// Configuración de tus feeds (urls proporcionadas anteriormente)
const config = {
    ciencia: "https://www.agenciasinc.es/feed/Ciencia",
    tecnologia: "https://www.muycomputer.com/feed/",
    videojuegos: "https://www.3djuegos.com/feedburner.xml",
    cine: "https://www.espinof.com/feedburner.xml"
};

// Llamada inicial cuando la página carga
window.onload = () => {
    fetchRSS(config.ciencia, 'ciencia');
    fetchRSS(config.tecnologia, 'tecnologia');
    fetchRSS(config.videojuegos, 'videojuegos');
    fetchRSS(config.cine, 'cine');
};
</script>

</body>
</html>
