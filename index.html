<!DOCTYPE html>
<html lang="es">
<head>
    <title>Daily News | Bryan García</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Raleway">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: #161616;
            --text-main: #f0f0f0;
            --text-dim: #999;
            --border-color: #222;
            --accent-blue: #00a2ff;
            --header-ciencia: #0d47a1;
            --header-tech: #37474f;
            --header-juegos: #b71c1c;
            --header-cine: #2e7d32;
        }

        body { background-color: var(--bg-color); color: var(--text-main); font-family: "Raleway", sans-serif; margin-bottom: 70px; }
        
        header { background: linear-gradient(180deg, #1a1a1a 0%, var(--bg-color) 100%); border-bottom: 1px solid var(--border-color); }

        .feed-container { 
            height: 72vh; 
            overflow-y: auto; 
            padding: 0 10px;
            background-color: var(--card-bg);
            scrollbar-width: thin;
            scrollbar-color: #444 transparent;
        }

        .feed-item { 
            display: flex; 
            align-items: center; 
            padding: 15px 10px; 
            border-bottom: 1px solid var(--border-color); 
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .feed-item:hover { background-color: #1f1f1f; }
        
        .feed-thumbnail-container { 
            flex: 0 0 60px; height: 60px; margin-right: 15px; 
            overflow: hidden; border-radius: 12px; background: #fff; 
            display: flex; align-items: center; justify-content: center;
            border: 1px solid #333;
        }
        .feed-thumbnail-container img { max-width: 75%; max-height: 75%; object-fit: contain; }

        .feed-title { font-size: 13.5px; font-weight: 600; margin: 0 0 6px 0; line-height: 1.4; color: #fff; }
        .feed-title a { text-decoration: none; color: inherit; }
        
        .source-tag { font-weight: 900; color: var(--accent-blue); font-size: 9px; letter-spacing: 0.5px; }

        .w3-card-4 { border-radius: 18px; border: 1px solid var(--border-color); background: var(--card-bg); overflow: hidden;}
        
        .header-box { padding: 4px 0; border-bottom: 2px solid rgba(255,255,255,0.1); }
        .w3-container h3 { font-weight: 800; text-transform: uppercase; font-size: 14px; margin: 15px 0; display: flex; align-items: center; justify-content: center; gap: 10px; color: #fff; }

        .main-footer {
            text-align: center; padding: 30px 0; color: var(--text-dim);
            font-size: 11px; letter-spacing: 2px; text-transform: uppercase; margin-top: 20px;
        }
        .main-footer b { color: #fff; border-bottom: 1px solid var(--accent-blue); }

        .mobile-nav {
            display: none; position: fixed; bottom: 15px; left: 5%; width: 90%;
            background: rgba(30, 30, 30, 0.9); backdrop-filter: blur(15px);
            border-radius: 25px; border: 1px solid #444; z-index: 1000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .mobile-nav button {
            flex: 1; padding: 12px 0; border: none; background: none;
            color: #777; font-size: 10px; font-weight: bold; transition: 0.3s;
        }

        .mobile-nav button.active { color: #fff; }
        .mobile-nav button.active i { color: var(--accent-blue); }

        @media (max-width: 992px) {
            .mobile-nav { display: flex; }
            .category-col { display: none; } 
            .category-col.active { display: block; }
            .main-footer { margin-bottom: 100px; }
        }
    </style>
</head>
<body>

<div class="w3-content" style="max-width:1800px">
    <header class="w3-container w3-center w3-padding-24"> 
        <h1 style="font-weight: 900; letter-spacing: 6px; font-size: 26px; color: #fff; margin:0">DAILY<span style="color:var(--accent-blue)">NEWS</span></h1>
        <p style="color: var(--text-dim); font-size: 10px; text-transform: uppercase; letter-spacing: 2px;">Curated by Bryan García & Gemini</p>
    </header>

    <div class="w3-row-padding w3-margin-top">
        <div id="col-ciencia" class="w3-col l3 m12 category-col active w3-margin-bottom">
            <div class="w3-card-4">
                <div class="w3-container header-box" style="background-color: var(--header-ciencia)">
                    <h3 class="w3-center"><i class="fas fa-microscope"></i> Ciencia</h3>
                </div>
                <div id="ciencia" class="w3-container feed-container"><p class="w3-padding">Sincronizando fuentes...</p></div>
            </div>
        </div>

        <div id="col-tecnologia" class="w3-col l3 m12 category-col w3-margin-bottom">
            <div class="w3-card-4">
                <div class="w3-container header-box" style="background-color: var(--header-tech)">
                    <h3 class="w3-center"><i class="fas fa-microchip"></i> Tech</h3>
                </div>
                <div id="tecnologia" class="w3-container feed-container"><p class="w3-padding">Sincronizando fuentes...</p></div>
            </div>
        </div>

        <div id="col-videojuegos" class="w3-col l3 m12 category-col w3-margin-bottom">
            <div class="w3-card-4">
                <div class="w3-container header-box" style="background-color: var(--header-juegos)">
                    <h3 class="w3-center"><i class="fas fa-gamepad"></i> Juegos</h3>
                </div>
                <div id="videojuegos" class="w3-container feed-container"><p class="w3-padding">Sincronizando fuentes...</p></div>
            </div>
        </div>

        <div id="col-cine" class="w3-col l3 m12 category-col w3-margin-bottom">
            <div class="w3-card-4">
                <div class="w3-container header-box" style="background-color: var(--header-cine)">
                    <h3 class="w3-center"><i class="fas fa-film"></i> Cine</h3>
                </div>
                <div id="cine" class="w3-container feed-container"><p class="w3-padding">Sincronizando fuentes...</p></div>
            </div>
        </div>
    </div>

    <footer class="main-footer">
        <p>Design & Code by <b>Bryan García</b> | Powered by <i class="fas fa-bolt" style="color:#4facfe"></i> <b>Gemini AI</b></p>
    </footer>
</div>

<nav class="mobile-nav">
  <button onclick="openTab('ciencia')" id="btn-ciencia" class="active"><i class="fas fa-microscope" style="display:block; font-size:18px"></i></button>
  <button onclick="openTab('tecnologia')" id="btn-tecnologia"><i class="fas fa-microchip" style="display:block; font-size:18px"></i></button>
  <button onclick="openTab('videojuegos')" id="btn-videojuegos"><i class="fas fa-gamepad" style="display:block; font-size:18px"></i></button>
  <button onclick="openTab('cine')" id="btn-cine"><i class="fas fa-film" style="display:block; font-size:18px"></i></button>
</nav>

<script>
const config = {
    ciencia: ["https://www.agenciasinc.es/feed/Ciencia", "https://feeds.elpais.com/mrss-s/pages/ep/site/elpais.com/section/ciencia/portada", "https://noticiasdelaciencia.com/rss/ciencia", "https://www.20minutos.es/rss/ciencia/", "https://scientias.net/feed/", "https://www.abc.es/rss/atom/ciencia/", "https://e00-elmundo.uecdn.es/rss/ciencia-y-salud.xml", "https://www.elespanol.com/rss/ciencia/", "https://www.elperiodico.com/es/rss/ciencia/rss.xml", "https://naukas.com/feed"],
    tecnologia: ["https://www.muycomputer.com/feed/", "https://www.20minutos.es/rss/tecnologia/", "https://www.europapress.es/rss/rss.aspx?ch=72", "https://www.xataka.com/feedburner.xml", "https://www.elespanol.com/rss/elandroidelibre/", "https://computerhoy.20minutos.es/rss/", "https://www.adslzone.net/feed/", "https://www.elespanol.com/rss/omicrono/"],
    videojuegos: ["https://www.3djuegos.com/feedburner.xml", "https://vandal.elespanol.com/xml.cgi", "https://www.eurogamer.es/?format=rss", "https://es.ign.com/feed.xml", "http://feeds.weblogssl.com/vidaextra", "https://www.hobbyconsolas.com/rss/"],
    cine: ["https://www.espinof.com/feedburner.xml", "https://www.sensacine.com/rss/noticias.xml", "https://www.20minutos.es/rss/cinemania/", "https://www.20minutos.es/rss/television/", "https://www.formulatv.com/xml/formulatv.xml", "https://www.elseptimoarte.net/rss_actualidad.php"]
};

const sourceData = {
    "SINC": { keywords: ["AGENCIASINC"], name: "SINC", logo: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRgdzVETxx1l4z1lVDMKZCNIoeQaGUUVxbLNw&s" },
    "EL PAÍS": { keywords: ["ELPAIS.COM"], name: "EL PAÍS", logo: "https://biblioteca.uva.es/files/2023/10/Logo-El-Pais.png" },
    "NCYT": { keywords: ["NOTICIASDELACIENCIA"], name: "NCYT", logo: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS-vXp5Z2n2-T9_L9uF-p0y4eP9H8O-p9v1Qw&s" },
    "20 MINUTOS": { keywords: ["20MINUTOS.ES"], name: "20 MINUTOS", logo: "https://upload.wikimedia.org/wikipedia/commons/0/06/20_minutos.svg" },
    "SCIENTIAS": { keywords: ["SCIENTIAS.NET"], name: "SCIENTIAS", logo: "https://scientias.net/wp-content/uploads/2021/04/cropped-logo-scientias-32x32.png" },
    "XATAKA": { keywords: ["XATAKA.COM"], name: "XATAKA", logo: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTGUuJ47JpfkIJcMmSD85KKMkIGSVJz3xO2jw&s" },
    "COMPUTER HOY": { keywords: ["COMPUTERHOY"], name: "COMPUTER HOY", logo: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR3y5N8H8_kX_1A_N7D8H9J6P2_k7y0j6P2Qw&s" },
    "3D JUEGOS": { keywords: ["3DJUEGOS"], name: "3D JUEGOS", logo: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT4TkCVZaSxmfU-e__gEatDsmp7U8QMTsIFug&s" }
};

function openTab(catName) {
    if (window.innerWidth > 992) return;
    const cols = document.getElementsByClassName("category-col");
    for (let i = 0; i < cols.length; i++) { cols[i].classList.remove("active"); }
    const btns = document.querySelectorAll(".mobile-nav button");
    btns.forEach(btn => btn.classList.remove("active"));
    document.getElementById("col-" + catName).classList.add("active");
    document.getElementById("btn-" + catName).classList.add("active");
    window.scrollTo(0,0);
}

function formatSmartDate(dateStr) {
    const newsDate = new Date(dateStr);
    const today = new Date();
    const timeStr = newsDate.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
    if (newsDate.toDateString() === today.toDateString()) return `Hoy | ${timeStr}`;
    return `${newsDate.toLocaleDateString('es-ES')} | ${timeStr}`;
}

async function loadCategoryFeeds(urls, elementId) {
    const fetchPromises = urls.map(url => 
        fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`)
        .then(res => res.json())
        .catch(() => ({ status: 'error' }))
    );

    try {
        const results = await Promise.all(fetchPromises);
        let allItems = results.filter(r => r.status === 'ok').flatMap(data => {
            return data.items.map(item => {
                let itemLink = (item.link || "").toUpperCase();
                let finalName = "INFO";
                let finalLogo = "https://via.placeholder.com/60/333/fff?text=NEWS";
                
                for (let key in sourceData) {
                    if (sourceData[key].keywords.some(k => itemLink.includes(k))) {
                        finalName = sourceData[key].name;
                        finalLogo = sourceData[key].logo;
                        break;
                    }
                }
                return {...item, sourceName: finalName, staticLogo: finalLogo};
            });
        });

        allItems.sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));
        const container = document.getElementById(elementId);
        container.innerHTML = allItems.map(item => `
            <div class="feed-item" onclick="window.open('${item.link}', '_blank')">
                <div class="feed-thumbnail-container"><img src="${item.staticLogo}" alt="logo"></div>
                <div class="feed-content-container">
                    <h6 class="feed-title">${item.title}</h6>
                    <div class="feed-meta"><span class="source-tag">${item.sourceName}</span><span>${formatSmartDate(item.pubDate)}</span></div>
                </div>
            </div>`).join('') || "<p class='w3-padding'>Sin noticias.</p>";
    } catch (err) { document.getElementById(elementId).innerHTML = "<p class='w3-padding'>Error de conexión.</p>"; }
}

window.onload = () => {
    loadCategoryFeeds(config.ciencia, 'ciencia');
    loadCategoryFeeds(config.tecnologia, 'tecnologia');
    loadCategoryFeeds(config.videojuegos, 'videojuegos');
    loadCategoryFeeds(config.cine, 'cine');
};
</script>
</body>
</html>
