<!DOCTYPE html>
<html lang="es">
<head>
    <title>DAILY NEWS | GLOBAL</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Raleway">
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: rgba(30, 30, 30, 0.7);
            --text-main: #f0f0f0;
            --text-dim: #b0b0b0;
            --border-color: #333;
            --header-ciencia: #0d47a1;
            --header-tech: #37474f;
            --header-juegos: #b71c1c;
            --header-cine: #000000;
        }

        body { background-color: var(--bg-color); color: var(--text-main); font-family: "Raleway", sans-serif; margin-bottom: 70px; }
        
        /* Gradientes sutiles restaurados */
        #col-ciencia { background: linear-gradient(180deg, rgba(13, 71, 161, 0.2) 0%, transparent 100%); }
        #col-tecnologia { background: linear-gradient(180deg, rgba(55, 71, 79, 0.2) 0%, transparent 100%); }
        #col-videojuegos { background: linear-gradient(180deg, rgba(183, 28, 28, 0.2) 0%, transparent 100%); }
        #col-cine { background: linear-gradient(180deg, rgba(50, 50, 50, 0.2) 0%, transparent 100%); }

        .feed-container { height: 75vh; overflow-y: scroll; padding: 10px; background-color: var(--card-bg); border-radius: 0 0 8px 8px; }
        .feed-container::-webkit-scrollbar { width: 4px; }
        .feed-container::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }

        .feed-item { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border-color); }
        .feed-thumbnail-container { flex: 0 0 65px; height: 65px; margin-right: 12px; overflow: hidden; border-radius: 4px; background: #fff; display: flex; align-items: center; justify-content: center; }
        .feed-thumbnail-container img { max-width: 85%; max-height: 85%; object-fit: contain; }

        .feed-content-container { flex: 1; min-width: 0; }
        .feed-title { font-size: 13px; font-weight: bold; margin: 0 0 4px 0; line-height: 1.2; }
        .feed-title a { text-decoration: none; color: var(--text-main); }
        
        .feed-meta { font-size: 10px; color: var(--text-dim); display: flex; justify-content: space-between; }
        .source-tag { font-weight: 800; color: #90caf9; text-transform: uppercase; }
        
        .mobile-nav { display: none; position: fixed; bottom: 0; width: 100%; background: #1a1a1a; border-top: 1px solid #333; z-index: 1000; }
        .mobile-nav button { flex: 1; padding: 15px 0; border: none; background: none; color: var(--text-dim); font-size: 10px; font-weight: bold; }
        .mobile-nav button.active { color: #fff; border-top: 3px solid #2196F3; }

        @media (max-width: 992px) {
            .mobile-nav { display: flex; }
            .category-col { display: none; } 
            .category-col.active { display: block; }
        }
    </style>
</head>
<body>

<header class="w3-container w3-center w3-padding-32"> 
  <h1 style="font-weight: 900; letter-spacing: 3px; font-size: 24px;"><b>DAILY NEWS</b></h1>
</header>

<div class="w3-row-padding" style="max-width:1800px; margin: auto;">
  <div id="col-ciencia" class="w3-col l3 m12 category-col active w3-margin-bottom">
    <div class="w3-card-4">
      <div class="w3-container" style="background-color: var(--header-ciencia)"><h3 class="w3-center">Ciencia</h3></div>
      <div id="ciencia" class="w3-container feed-container"></div>
    </div>
  </div>
  <div id="col-tecnologia" class="w3-col l3 m12 category-col w3-margin-bottom">
    <div class="w3-card-4">
      <div class="w3-container" style="background-color: var(--header-tech)"><h3 class="w3-center">Tecnología</h3></div>
      <div id="tecnologia" class="w3-container feed-container"></div>
    </div>
  </div>
  <div id="col-videojuegos" class="w3-col l3 m12 category-col w3-margin-bottom">
    <div class="w3-card-4">
      <div class="w3-container" style="background-color: var(--header-juegos)"><h3 class="w3-center">Videojuegos</h3></div>
      <div id="videojuegos" class="w3-container feed-container"></div>
    </div>
  </div>
  <div id="col-cine" class="w3-col l3 m12 category-col w3-margin-bottom">
    <div class="w3-card-4">
      <div class="w3-container" style="background-color: var(--header-cine)"><h3 class="w3-center">Cine y TV</h3></div>
      <div id="cine" class="w3-container feed-container"></div>
    </div>
  </div>
</div>

<nav class="mobile-nav">
  <button onclick="openTab('ciencia')" id="btn-ciencia" class="active">Ciencia</button>
  <button onclick="openTab('tecnologia')" id="btn-tecnologia">Tech</button>
  <button onclick="openTab('videojuegos')" id="btn-videojuegos">Juegos</button>
  <button onclick="openTab('cine')" id="btn-cine">Cine</button>
</nav>

<script>
const config = {
    ciencia: [
        "https://www.agenciasinc.es/feed/Ciencia",
        "https://noticiasdelaciencia.com/rss/ciencia",
        "https://feeds.elpais.com/mrss-s/pages/ep/site/elpais.com/section/ciencia/portada",
        "https://naukas.com/feed",
        "https://scientias.net/feed/",
        "https://www.abc.es/rss/atom/ciencia/",
        "https://e00-elmundo.uecdn.es/rss/ciencia-y-salud.xml",
        "https://www.elespanol.com/rss/ciencia/",
        "https://www.elperiodico.com/es/rss/ciencia/rss.xml"
    ],
    tecnologia: [
        "https://www.muycomputer.com/feed/",
        "https://www.xataka.com/feedburner.xml",
        "https://www.elespanol.com/rss/omicrono/",
        "https://computerhoy.20minutos.es/rss/",
        "https://www.adslzone.net/feed/",
        "https://www.elespanol.com/rss/elandroidelibre/",
        "https://www.europapress.es/rss/rss.aspx?ch=72"
    ],
    videojuegos: [
        "https://www.3djuegos.com/feedburner.xml",
        "https://vandal.elespanol.com/xml.cgi",
        "https://www.eurogamer.es/?format=rss",
        "https://es.ign.com/feed.xml",
        "http://feeds.weblogssl.com/vidaextra",
        "https://www.hobbyconsolas.com/rss/"
    ],
    cine: [
        "https://www.espinof.com/feedburner.xml",
        "https://www.sensacine.com/rss/noticias.xml",
        "https://www.20minutos.es/rss/cinemania/",
        "https://www.formulatv.com/xml/formulatv.xml",
        "https://www.elseptimoarte.net/rss_actualidad.php",
        "https://feeds.feedburner.com/hello_friki"
    ]
};

const sourceData = {
    "SINC": { keywords: ["SINC"], name: "SINC", logo: "https://www.agenciasinc.es/favicon.ico" },
    "EL PAÍS": { keywords: ["EL PAIS", "EL PAÍS"], name: "EL PAÍS", logo: "https://biblioteca.uva.es/files/2023/10/Logo-El-Pais.png" },
    "NCYT": { keywords: ["NCYT", "NOTICIASDELACIENCIA"], name: "NCYT", logo: "https://noticiasdelaciencia.com/images/logo_rss.png" },
    "NAUKAS": { keywords: ["NAUKAS"], name: "NAUKAS", logo: "https://naukas.com/fx/uploads/2019/09/Naukas.jpg" },
    "SCIENTIAS": { keywords: ["SCIENTIAS"], name: "SCIENTIAS", logo: "https://scientias.net/wp-content/uploads/2021/04/cropped-logo-scientias-32x32.png" },
    "ABC": { keywords: ["ABC.ES", "ABC_ES"], name: "ABC", logo: "https://www.abc.es/favicon.ico" },
    "EL MUNDO": { keywords: ["ELMUNDO", "EL MUNDO"], name: "EL MUNDO", logo: "https://e00-elmundo.uecdn.es/favicon.ico" },
    "EL ESPAÑOL": { keywords: ["ELESPANOL", "EL ESPAÑOL"], name: "EL ESPAÑOL", logo: "https://s1.elespanol.com/static/ELE_Logo_Home.png" },
    "EL PERIÓDICO": { keywords: ["ELPERIODICO", "EL PERIÓDICO"], name: "EL PERIÓDICO", logo: "https://www.elperiodico.com/favicon.ico" },
    "XATAKA": { keywords: ["XATAKA"], name: "XATAKA", logo: "https://www.xataka.com/favicon.ico" },
    "OMICRONO": { keywords: ["OMICRONO"], name: "OMICRONO", logo: "https://s1.elespanol.com/static/favicon_omicrono.ico" },
    "COMPUTER HOY": { keywords: ["COMPUTERHOY"], name: "COMPUTER HOY", logo: "https://computerhoy.com/favicon.ico" },
    "ADSL ZONE": { keywords: ["ADSLZONE"], name: "ADSL ZONE", logo: "https://www.adslzone.net/favicon.ico" },
    "3D JUEGOS": { keywords: ["3DJUEGOS"], name: "3D JUEGOS", logo: "https://www.3djuegos.com/favicon.ico" },
    "VANDAL": { keywords: ["VANDAL"], name: "VANDAL", logo: "https://vandal.elespanol.com/favicon.ico" },
    "EUROGAMER": { keywords: ["EUROGAMER"], name: "EUROGAMER", logo: "https://www.eurogamer.es/favicon.ico" },
    "IGN": { keywords: ["IGN"], name: "IGN", logo: "https://es.ign.com/favicon.ico" },
    "VIDA EXTRA": { keywords: ["VIDAEXTRA"], name: "VIDA EXTRA", logo: "https://www.vidaextra.com/favicon.ico" },
    "HOBBY CONSOLAS": { keywords: ["HOBBYCONSOLAS"], name: "HOBBY CONSOLAS", logo: "https://www.hobbyconsolas.com/favicon.ico" },
    "ESPINOF": { keywords: ["ESPINOF"], name: "ESPINOF", logo: "https://www.espinof.com/favicon.ico" },
    "SENSACINE": { keywords: ["SENSACINE"], name: "SENSACINE", logo: "https://www.sensacine.com/favicon.ico" },
    "CINEMANÍA": { keywords: ["CINEMANIA"], name: "CINEMANÍA", logo: "https://media.muckrack.com/groups/icons/JqoZrqU2_400x400.jpg" },
    "FÓRMULA TV": { keywords: ["FORMULATV"], name: "FÓRMULA TV", logo: "https://www.formulatv.com/favicon.ico" },
    "EL SÉPTIMO ARTE": { keywords: ["ELSEPTIMOARTE"], name: "EL SÉPTIMO ARTE", logo: "https://www.elseptimoarte.net/favicon.ico" },
    "HELLO FRIKI": { keywords: ["HELLO FRIKI", "HELLOFRIKI"], name: "HELLO FRIKI", logo: "https://hellofriki.com/favicon.ico" },
    "MUY COMPUTER": { keywords: ["MUYCOMPUTER"], name: "MUY COMPUTER", logo: "https://www.muycomputer.com/favicon.ico" },
    "EUROPA PRESS": { keywords: ["EUROPAPRESS"], name: "EUROPA PRESS", logo: "https://www.europapress.es/favicon.ico" }
};

function formatSmartDate(dateStr) {
    const newsDate = new Date(dateStr);
    const today = new Date();
    const yesterday = new Date();
    yesterday.setDate(today.getDate() - 1);
    const timeStr = newsDate.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
    if (newsDate.toDateString() === today.toDateString()) return `Hoy | ${timeStr}`;
    if (newsDate.toDateString() === yesterday.toDateString()) return `Ayer | ${timeStr}`;
    return `${newsDate.toLocaleDateString('es-ES')} | ${timeStr}`;
}

async function loadCategoryFeeds(urls, elementId) {
    let allItems = [];
    const container = document.getElementById(elementId);
    container.innerHTML = "<p class='w3-padding'>Cargando...</p>";

    const fetchPromises = urls.map(url => 
        fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`)
        .then(res => res.json())
        .then(data => {
            if(data.status === 'ok') {
                return data.items.map(item => {
                    const fTitle = (data.feed.title || "").toUpperCase();
                    const iLink = (item.link || "").toUpperCase();
                    
                    let sourceKey = Object.keys(sourceData).find(key => {
                        return sourceData[key].keywords.some(k => 
                            fTitle.includes(k) || iLink.includes(k.replace(/\s/g, ""))
                        );
                    });
                    
                    return {
                        ...item,
                        sourceName: sourceKey ? sourceData[sourceKey].name : "INFO",
                        staticLogo: sourceKey ? sourceData[sourceKey].logo : `https://www.google.com/s2/favicons?sz=64&domain=${new URL(item.link).hostname}`,
                        timestamp: new Date(item.pubDate).getTime()
                    };
                });
            }
            return [];
        }).catch(() => [])
    );

    const results = await Promise.all(fetchPromises);
    allItems = results.flat().sort((a, b) => b.timestamp - a.timestamp);
    
    container.innerHTML = allItems.map(item => `
        <div class="feed-item">
            <div class="feed-thumbnail-container"><img src="${item.staticLogo}" onerror="this.src='https://www.google.com/s2/favicons?sz=64&domain=${new URL(item.link).hostname}'"></div>
            <div class="feed-content-container">
                <h6 class="feed-title"><a href="${item.link}" target="_blank">${item.title}</a></h6>
                <div class="feed-meta"><span class="source-tag">${item.sourceName}</span><span>${formatSmartDate(item.pubDate)}</span></div>
            </div>
        </div>
    `).join('') || "<p class='w3-padding'>No hay noticias.</p>";
}

function openTab(catName) {
    if (window.innerWidth > 992) return;
    document.querySelectorAll(".category-col, .mobile-nav button").forEach(el => el.classList.remove("active"));
    document.getElementById("col-" + catName).classList.add("active");
    document.getElementById("btn-" + catName).classList.add("active");
}

window.onload = () => {
    Object.keys(config).forEach(cat => loadCategoryFeeds(config[cat], cat));
};
</script>
</body>
</html>
