<!DOCTYPE html>
<html lang="es">
<head>
    <title>Daily News</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Raleway">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --text-dim: #b0b0b0;
            --border-color: #333;
            --header-ciencia: #0d47a1;
            --header-tech: #37474f;
            --header-juegos: #b71c1c;
            --header-cine: #2e7d32;
        }

        body { background-color: var(--bg-color); color: var(--text-main); font-family: "Raleway", sans-serif; margin-bottom: 70px; }
        
        .feed-container { height: 75vh; overflow-y: scroll; padding-right: 5px; background-color: var(--card-bg); }
        @media (max-width: 600px) { .feed-container { height: calc(100vh - 250px); } }

        .feed-container::-webkit-scrollbar { width: 4px; }
        .feed-container::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }

        .feed-item { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border-color); }
        
        .feed-thumbnail-container { 
            flex: 0 0 70px; height: 70px; margin-right: 12px; 
            overflow: hidden; border-radius: 4px; background: #fff; 
            display: flex; align-items: center; justify-content: center;
        }
        .feed-thumbnail-container img { max-width: 85%; max-height: 85%; object-fit: contain; }

        .feed-content-container { flex: 1; min-width: 0; }
        .feed-title { font-size: 13px; font-weight: bold; margin: 0 0 4px 0; line-height: 1.2; }
        .feed-title a { text-decoration: none; color: var(--text-main); }
        
        .feed-meta { 
            font-size: 10px; color: var(--text-dim); 
            display: flex; justify-content: space-between; width: 100%;
        }
        .source-tag { font-weight: 800; color: #90caf9; text-transform: uppercase; }
        
        .w3-card-4 { border: none; overflow: hidden; border-radius: 8px; }
        .w3-container h3 { font-weight: bold; text-transform: uppercase; font-size: 15px; margin: 15px 0; display: flex; align-items: center; justify-content: center; gap: 10px; color: #fff; }

        /* FOOTER ESTILO */
        .main-footer {
            text-align: center;
            padding: 20px 0;
            color: var(--text-dim);
            font-size: 12px;
            letter-spacing: 1px;
            border-top: 1px solid var(--border-color);
            margin-top: 30px;
        }
        .main-footer b { color: #fff; }
        .gemini-icon { color: #4facfe; }

        .mobile-nav {
            display: none;
            position: fixed;
            bottom: 0;
            width: 100%;
            background: #1e1e1e;
            border-top: 1px solid #333;
            z-index: 1000;
        }

        .mobile-nav button {
            flex: 1;
            padding: 10px 0;
            border: none;
            background: none;
            color: var(--text-dim);
            font-size: 10px;
            text-transform: uppercase;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .mobile-nav button.active {
            color: #fff;
            background: #252525;
            border-top: 3px solid #2196F3;
        }

        @media (max-width: 992px) {
            .mobile-nav { display: flex; }
            .category-col { display: none; } 
            .category-col.active { display: block; }
            .main-footer { margin-bottom: 80px; } /* Espacio para no tapar el footer con la nav móvil */
        }
    </style>
</head>
<body>

      </div>

</div>

<footer class="main-footer">
    <p>Creado por <b>Bryan García</b> con <i class="fas fa-bolt gemini-icon"></i> <b>Gemini</b></p>

</div>

function openTab(catName) {
    if (window.innerWidth > 992) return;
    const cols = document.getElementsByClassName("category-col");
    for (let i = 0; i < cols.length; i++) { cols[i].classList.remove("active"); }
    const btns = document.querySelectorAll(".mobile-nav button");
    btns.forEach(btn => btn.classList.remove("active"));
    document.getElementById("col-" + catName).classList.add("active");
    document.getElementById("btn-" + catName).classList.add("active");
    window.scrollTo(0,0);
}

function formatSmartDate(dateStr) {
    const newsDate = new Date(dateStr);
    const today = new Date();
    const yesterday = new Date();
    yesterday.setDate(today.getDate() - 1);
    const timeStr = newsDate.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
    if (newsDate.toDateString() === today.toDateString()) return `Hoy | ${timeStr}`;
    if (newsDate.toDateString() === yesterday.toDateString()) return `Ayer | ${timeStr}`;
    return `${newsDate.toLocaleDateString('es-ES')} | ${timeStr}`;
}

async function loadCategoryFeeds(urls, elementId) {
    const fetchPromises = urls.map(url => 
        fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`)
        .then(res => res.json())
        .then(data => {
            if(data.status === 'ok') {
                return data.items.map(item => {
                    let feedTitle = (data.feed.title || "").toUpperCase();
                    let feedLink = (data.feed.link || "").toUpperCase();
                    let itemLink = (item.link || "").toUpperCase();
                    let finalName = "INFO";
                    let finalLogo = "https://via.placeholder.com/85/333/fff?text=NEWS";
                    
                    if (itemLink.includes("CINEMANIA") || feedTitle.includes("CINEMANÍA")) {
                        finalName = sourceData["CINEMANÍA"].name;
                        finalLogo = sourceData["CINEMANÍA"].logo;
                    } 
                    else if (itemLink.includes("COMPUTERHOY")) {
                        finalName = sourceData["COMPUTER HOY"].name;
                        finalLogo = sourceData["COMPUTER HOY"].logo;
                    }
                    else if (itemLink.includes("OMICRONO")) {
                        finalName = sourceData["OMICRONO"].name;
                        finalLogo = sourceData["OMICRONO"].logo;
                    }
                    else if (itemLink.includes("VANDAL")) {
                        finalName = sourceData["VANDAL"].name;
                        finalLogo = sourceData["VANDAL"].logo;
                    }
                    else if (itemLink.includes("ANDROIDELIBRE")) {
                        finalName = sourceData["EL ANDROIDE LIBRE"].name;
                        finalLogo = sourceData["EL ANDROIDE LIBRE"].logo;
                    }
                    else if (itemLink.includes("20MINUTOS.ES")) {
                        finalName = sourceData["20 MINUTOS"].name;
                        finalLogo = sourceData["20 MINUTOS"].logo;
                    }
                    else {
                        for (let key in sourceData) {
                            if (sourceData[key].keywords.some(k => feedTitle.includes(k) || feedLink.includes(k) || itemLink.includes(k))) {
                                finalName = sourceData[key].name;
                                finalLogo = sourceData[key].logo;
                                break;
                            }
                        }
                    }
                    return {...item, sourceName: finalName, staticLogo: finalLogo};
                });
            }
            return [];
        })
    );

    try {
        const results = await Promise.all(fetchPromises);
        let allItems = results.flat().sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));
        const container = document.getElementById(elementId);
        let html = '';
        allItems.forEach(item => {
            html += `
                <div class="feed-item">
                    <div class="feed-thumbnail-container"><img src="${item.staticLogo}" alt="logo"></div>
                    <div class="feed-content-container">
                        <h6 class="feed-title"><a href="${item.link}" target="_blank">${item.title}</a></h6>
                        <div class="feed-meta"><span class="source-tag">${item.sourceName}</span><span>${formatSmartDate(item.pubDate)}</span></div>
                    </div>
                </div>`;
        });
        container.innerHTML = html || "<p class='w3-padding'>Sin noticias.</p>";
    } catch (err) { document.getElementById(elementId).innerHTML = "<p class='w3-padding'>Error de conexión.</p>"; }
}
