<!DOCTYPE html>
<html lang="es">
<head>
    <title>DAILY NEWS</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Raleway">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --text-dim: #b0b0b0;
            --border-color: #333;
            --header-ciencia: #0d47a1;
            --header-tech: #37474f;
            --header-juegos: #b71c1c;
            --header-cine: #000000;
        }

        body { background-color: var(--bg-color); color: var(--text-main); font-family: "Raleway", sans-serif; margin-bottom: 70px; }
        
        .feed-container { height: 75vh; overflow-y: scroll; padding-right: 5px; background-color: var(--card-bg); }
        @media (max-width: 600px) { .feed-container { height: calc(100vh - 220px); } }

        .feed-container::-webkit-scrollbar { width: 4px; }
        .feed-container::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }

        .feed-item { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border-color); }
        
        .feed-thumbnail-container { 
            flex: 0 0 70px; height: 70px; margin-right: 12px; 
            overflow: hidden; border-radius: 4px; background: #fff; 
            display: flex; align-items: center; justify-content: center;
        }
        .feed-thumbnail-container img { max-width: 85%; max-height: 85%; object-fit: contain; }

        .feed-content-container { flex: 1; min-width: 0; }
        .feed-title { font-size: 13px; font-weight: bold; margin: 0 0 4px 0; line-height: 1.2; }
        .feed-title a { text-decoration: none; color: var(--text-main); }
        
        .feed-meta { 
            font-size: 10px; color: var(--text-dim); 
            display: flex; justify-content: space-between; width: 100%;
        }
        .source-tag { font-weight: 800; color: #90caf9; text-transform: uppercase; }
        
        .w3-card-4 { background-color: var(--card-bg); border: none; }
        .w3-container h3 { font-weight: bold; text-transform: uppercase; font-size: 16px; margin: 15px 0; }

        .mobile-nav {
            display: none;
            position: fixed;
            bottom: 0;
            width: 100%;
            background: #1e1e1e;
            border-top: 1px solid #333;
            z-index: 1000;
        }

        .mobile-nav button {
            flex: 1;
            padding: 15px 0;
            border: none;
            background: none;
            color: var(--text-dim);
            font-size: 10px;
            text-transform: uppercase;
            font-weight: bold;
            cursor: pointer;
        }

        .mobile-nav button.active {
            color: #fff;
            border-top: 3px solid #2196F3;
            background: #252525;
        }

        @media (max-width: 992px) {
            .mobile-nav { display: flex; }
            .category-col { display: none; } 
            .category-col.active { display: block; }
            header { padding: 20px 0 !important; }
        }
    </style>
</head>
<body>

<div class="w3-content" style="max-width:1800px">

<header class="w3-container w3-center w3-padding-32"> 
  <h1 style="font-weight: 900; letter-spacing: 3px; font-size: 24px;"><b>DAILY NEWS</b></h1>
</header>

<div class="w3-row-padding">
  <div id="col-ciencia" class="w3-col l3 m12 category-col active w3-margin-bottom">
    <div class="w3-card-4">
      <div class="w3-container" style="background-color: var(--header-ciencia)"><h3 class="w3-center">Ciencia</h3></div>
      <div id="ciencia" class="w3-container feed-container"><p class="w3-padding">Cargando...</p></div>
    </div>
  </div>

  <div id="col-tecnologia" class="w3-col l3 m12 category-col w3-margin-bottom">
    <div class="w3-card-4">
      <div class="w3-container" style="background-color: var(--header-tech)"><h3 class="w3-center">Tecnología</h3></div>
      <div id="tecnologia" class="w3-container feed-container"><p class="w3-padding">Cargando...</p></div>
    </div>
  </div>

  <div id="col-videojuegos" class="w3-col l3 m12 category-col w3-margin-bottom">
    <div class="w3-card-4">
      <div class="w3-container" style="background-color: var(--header-juegos)"><h3 class="w3-center">Videojuegos</h3></div>
      <div id="videojuegos" class="w3-container feed-container"><p class="w3-padding">Cargando...</p></div>
    </div>
  </div>

  <div id="col-cine" class="w3-col l3 m12 category-col w3-margin-bottom">
    <div class="w3-card-4">
      <div class="w3-container" style="background-color: var(--header-cine)"><h3 class="w3-center">Cine y TV</h3></div>
      <div id="cine" class="w3-container feed-container"><p class="w3-padding">Cargando...</p></div>
    </div>
  </div>
</div>
</div>

<nav class="mobile-nav">
  <button onclick="openTab('ciencia')" id="btn-ciencia" class="active">Ciencia</button>
  <button onclick="openTab('tecnologia')" id="btn-tecnologia">Tech</button>
  <button onclick="openTab('videojuegos')" id="btn-videojuegos">Juegos</button>
  <button onclick="openTab('cine')" id="btn-cine">Cine</button>
</nav>

<script>
const config = {
    ciencia: [
        "https://www.agenciasinc.es/feed/Ciencia",
        "https://feeds.elpais.com/mrss-s/pages/ep/site/elpais.com/section/ciencia/portada",
        "https://noticiasdelaciencia.com/rss/ciencia",
        "https://www.20minutos.es/rss/ciencia/",
        "https://scientias.net/feed/",
        "https://www.abc.es/rss/atom/ciencia/",
        "https://e00-elmundo.uecdn.es/rss/ciencia-y-salud.xml",
        "https://www.elespanol.com/rss/ciencia/",
        "https://www.elperiodico.com/es/rss/ciencia/rss.xml"
    ],
    tecnologia: [
        "https://www.muycomputer.com/feed/",
        "https://www.20minutos.es/rss/tecnologia/"
    ],
    videojuegos: ["https://www.3djuegos.com/feedburner.xml"],
    cine: [
        "https://www.espinof.com/feedburner.xml",
        "https://www.sensacine.com/rss/noticias.xml"
    ]
};

const sourceData = {
    "SINC": { keywords: ["SINC", "AGENCIA SI"], name: "SINC", logo: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRgdzVETxx1l4z1lVDMKZCNIoeQaGUUVxbLNw&s" },
    "EL PAÍS": { keywords: ["EL PAÍS", "EL PAIS"], name: "EL PAÍS", logo: "https://biblioteca.uva.es/files/2023/10/Logo-El-Pais.png" },
    "NCYT": { keywords: ["NCYT", "NOTICIAS DE LA CIENCIA"], name: "NCYT", logo: "https://yt3.googleusercontent.com/Z0bnKMwa2DOrPvtVUhpzuWfCNrzTIfjFhGukHh2xg4XnQhQsOLAx5fswoSrIolQHBPMGd0CY374=s900-c-k-c0x00ffffff-no-rj" },
    "20 MINUTOS": { keywords: ["20 MINUTOS", "20MINUTOS"], name: "20 MINUTOS", logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/0/06/20_minutos.svg/330px-20_minutos.svg.png" },
    "SCIENTIAS": { keywords: ["SCIENTIAS"], name: "SCIENTIAS", logo: "https://cdn.brandfetch.io/scientias.nl/fallback/lettermark/theme/dark/h/256/w/256/icon?c=1bfwsmEH20zzEfSNTed" },
    "ABC": { keywords: ["ABC"], name: "ABC", logo: "https://play-lh.googleusercontent.com/1BHz5zmBVutix7HhBg6V2MHAPpLb2iEbypKGuXsgirirab21ZrN-hlypP72q0eVNltLkbBw0fBImuUzi6G1BeQ=w240-h480-rw" },
    "EL MUNDO": { keywords: ["MUNDO"], name: "EL MUNDO", logo: "https://play-lh.googleusercontent.com/BzW36kJtSe3OheGZj3ALXRftyEZx01qG4mZTghnU9h9z0zgW3ONIQN-bLaewfa2FJN0" },
    "EL ESPAÑOL": { keywords: ["ESPAÑOL", "ESPANOL"], name: "EL ESPAÑOL", logo: "https://play-lh.googleusercontent.com/wjeAR1FcFIBzXzgwFUi1JqkZ-j2lyi_4ijIWpmHjW7uUCUUjFTkT5BjTROucPTvuxy0z" },
    "EL PERIÓDICO": { keywords: ["PERIODICO", "PERIÓDICO"], name: "EL PERIÓDICO", logo: "https://play-lh.googleusercontent.com/YPbhMp-YhAfgdmUHDbhdWLSoU0t_O4WKLusgze6-hJ7XQMGglNXVtcIhb7Yk7hLxfRE" },
    "MUY COMPUTER": { keywords: ["MUYCOMPUTE", "MUYCOMPUTER"], name: "MUY COMPUTER", logo: "https://www.tpnet.es/wp-content/uploads/2018/09/mc-tecnologia-consumo-content-marketing-video-design-logo.png" },
    "3D JUEGOS": { keywords: ["3DJUEGOS"], name: "3D JUEGOS", logo: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT4TkCVZaSxmfU-e__gEatDsmp7U8QMTsIFug&s" },
    "ESPINOF": { keywords: ["ESPINOF"], name: "ESPINOF", logo: "https://yt3.googleusercontent.com/ytc/AIdro_mwyVcXPGLPElADFqCr5xP9g086XmBMYYYbOu9bVagVJc0=s900-c-k-c0x00ffffff-no-rj" },
    "SENSACINE": { keywords: ["SENSACINE"], name: "SENSACINE", logo: "https://play-lh.googleusercontent.com/UsgtDAGmLYxCdyZDf7DsLJnHLGE_gHtyC7Tm2X-mY7inKyWJD0vCstJMToUi4nwZ0aYE" }
};

function openTab(catName) {
    if (window.innerWidth > 992) return;
    const cols = document.getElementsByClassName("category-col");
    for (let i = 0; i < cols.length; i++) { cols[i].classList.remove("active"); }
    const btns = document.querySelectorAll(".mobile-nav button");
    btns.forEach(btn => btn.classList.remove("active"));
    document.getElementById("col-" + catName).classList.add("active");
    document.getElementById("btn-" + catName).classList.add("active");
    window.scrollTo(0,0);
}

function formatSmartDate(dateStr) {
    const newsDate = new Date(dateStr);
    const today = new Date();
    const yesterday = new Date();
    yesterday.setDate(today.getDate() - 1);
    const timeStr = newsDate.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
    if (newsDate.toDateString() === today.toDateString()) return `Hoy | ${timeStr}`;
    if (newsDate.toDateString() === yesterday.toDateString()) return `Ayer | ${timeStr}`;
    return `${newsDate.toLocaleDateString('es-ES')} | ${timeStr}`;
}

async function loadCategoryFeeds(urls, elementId) {
    let allItems = [];
    const fetchPromises = urls.map(url => 
        fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`)
        .then(res => res.json())
        .then(data => {
            if(data.status === 'ok') {
                return data.items.map(item => {
                    let feedTitle = (data.feed.title || "").toUpperCase();
                    let feedLink = (data.feed.link || "").toUpperCase();
                    let finalName = "INFO";
                    let finalLogo = "https://via.placeholder.com/85/333/fff?text=NEWS";
                    
                    for (let key in sourceData) {
                        if (sourceData[key].keywords.some(k => feedTitle.includes(k) || feedLink.includes(k))) {
                            finalName = sourceData[key].name;
                            finalLogo = sourceData[key].logo;
                            break;
                        }
                    }
                    return {...item, sourceName: finalName, staticLogo: finalLogo};
                });
            }
            return [];
        })
    );

    try {
        const results = await Promise.all(fetchPromises);
        allItems = results.flat().sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));
        const container = document.getElementById(elementId);
        let html = '';
        allItems.forEach(item => {
            html += `
                <div class="feed-item">
                    <div class="feed-thumbnail-container"><img src="${item.staticLogo}" alt="logo"></div>
                    <div class="feed-content-container">
                        <h6 class="feed-title"><a href="${item.link}" target="_blank">${item.title}</a></h6>
                        <div class="feed-meta"><span class="source-tag">${item.sourceName}</span><span>${formatSmartDate(item.pubDate)}</span></div>
                    </div>
                </div>`;
        });
        container.innerHTML = html || "<p class='w3-padding'>Sin noticias.</p>";
    } catch (err) { document.getElementById(elementId).innerHTML = "<p class='w3-padding'>Error de conexión.</p>"; }
}

window.onload = () => {
    loadCategoryFeeds(config.ciencia, 'ciencia');
    loadCategoryFeeds(config.tecnologia, 'tecnologia');
    loadCategoryFeeds(config.videojuegos, 'videojuegos');
    loadCategoryFeeds(config.cine, 'cine');
};
</script>
</body>
</html>
