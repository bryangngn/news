<!DOCTYPE html>
<html lang="es">
<head>
    <title>Daily News hover</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Raleway">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f0f0f; /* Un negro un poco más profundo */
            --card-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --text-dim: #b0b0b0;
            --border-color: #333;
            --accent-blue: #2196F3;
            --header-ciencia: #0d47a1;
            --header-tech: #37474f;
            --header-juegos: #b71c1c;
            --header-cine: #2e7d32;
        }

        body { background-color: var(--bg-color); color: var(--text-main); font-family: "Raleway", sans-serif; margin-bottom: 70px; }
        
        /* Contenedor con efecto de entrada suave */
        .feed-container { 
            height: 75vh; 
            overflow-y: scroll; 
            padding-right: 5px; 
            background-color: var(--card-bg);
            animation: fadeIn 0.8s ease-in-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) { .feed-container { height: calc(100vh - 250px); } }

        .feed-container::-webkit-scrollbar { width: 4px; }
        .feed-container::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }

        /* Mejora visual en cada item: Efecto Hover */
        .feed-item { 
            display: flex; 
            align-items: center; 
            padding: 12px 8px; 
            border-bottom: 1px solid var(--border-color); 
            transition: background 0.3s ease;
        }
        .feed-item:hover { background-color: #2a2a2a; }
        
        .feed-thumbnail-container { 
            flex: 0 0 70px; height: 70px; margin-right: 12px; 
            overflow: hidden; border-radius: 8px; background: #fff; 
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .feed-thumbnail-container img { max-width: 80%; max-height: 80%; object-fit: contain; }

        .feed-content-container { flex: 1; min-width: 0; }
        .feed-title { font-size: 13px; font-weight: bold; margin: 0 0 4px 0; line-height: 1.3; }
        .feed-title a { text-decoration: none; color: var(--text-main); }
        .feed-title a:hover { color: var(--accent-blue); }
        
        .feed-meta { 
            font-size: 10px; color: var(--text-dim); 
            display: flex; justify-content: space-between; width: 100%;
        }
        .source-tag { font-weight: 800; color: #90caf9; text-transform: uppercase; }
        
        .w3-card-4 { border: none; overflow: hidden; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        
        /* Sombra interna para los headers */
        .header-box {
            padding: 2px 0;
            box-shadow: inset 0 -10px 15px -10px rgba(0,0,0,0.5);
        }
        .w3-container h3 { 
            font-weight: 800; 
            text-transform: uppercase; 
            font-size: 14px; 
            margin: 15px 0; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px; 
            color: #fff; 
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        .main-footer {
            text-align: center;
            padding: 30px 0;
            color: var(--text-dim);
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 20px;
        }
        .main-footer b { color: #fff; border-bottom: 1px solid var(--accent-blue); }
        .gemini-icon { color: #4facfe; margin: 0 4px; }

        /* Nav móvil más estilizada */
        .mobile-nav {
            display: none;
            position: fixed;
            bottom: 0;
            width: 100%;
            background: rgba(30, 30, 30, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid #333;
            z-index: 1000;
        }

        .mobile-nav button {
            flex: 1;
            padding: 12px 0;
            border: none;
            background: none;
            color: var(--text-dim);
            font-size: 9px;
            text-transform: uppercase;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .mobile-nav button.active {
            color: var(--accent-blue);
            background: rgba(255,255,255,0.05);
        }

        @media (max-width: 992px) {
            .mobile-nav { display: flex; }
            .category-col { display: none; } 
            .category-col.active { display: block; }
            .main-footer { margin-bottom: 90px; }
        }
    </style>
</head>
<body>

<div class="w3-content" style="max-width:1800px">

<header class="w3-container w3-center w3-padding-32"> 
  <h1 style="font-weight: 900; letter-spacing: 5px; font-size: 28px; color: #fff;"><b>DAILY NEWS</b></h1>
  <p style="color: var(--text-dim); font-size: 12px; margin-top: -10px;">Actualización en tiempo real</p>
</header>

<div class="w3-row-padding">
  <div id="col-ciencia" class="w3-col l3 m12 category-col active w3-margin-bottom">
    <div class="w3-card-4">
      <div class="w3-container header-box" style="background-color: var(--header-ciencia)">
        <h3 class="w3-center"><i class="fas fa-microscope"></i> Ciencia</h3>
      </div>
      <div id="ciencia" class="w3-container feed-container"><p class="w3-padding">Cargando...</p></div>
    </div>
  </div>

  <div id="col-tecnologia" class="w3-col l3 m12 category-col w3-margin-bottom">
    <div class="w3-card-4">
      <div class="w3-container header-box" style="background-color: var(--header-tech)">
        <h3 class="w3-center"><i class="fas fa-microchip"></i> Tecnología</h3>
      </div>
      <div id="tecnologia" class="w3-container feed-container"><p class="w3-padding">Cargando...</p></div>
    </div>
  </div>

  <div id="col-videojuegos" class="w3-col l3 m12 category-col w3-margin-bottom">
    <div class="w3-card-4">
      <div class="w3-container header-box" style="background-color: var(--header-juegos)">
        <h3 class="w3-center"><i class="fas fa-gamepad"></i> Videojuegos</h3>
      </div>
      <div id="videojuegos" class="w3-container feed-container"><p class="w3-padding">Cargando...</p></div>
    </div>
  </div>

  <div id="col-cine" class="w3-col l3 m12 category-col w3-margin-bottom">
    <div class="w3-card-4">
      <div class="w3-container header-box" style="background-color: var(--header-cine)">
        <h3 class="w3-center"><i class="fas fa-film"></i> Cine y TV</h3>
      </div>
      <div id="cine" class="w3-container feed-container"><p class="w3-padding">Cargando...</p></div>
    </div>
  </div>
</div>

<footer class="main-footer">
    <p>Creado por <b>Bryan García</b> con <i class="fas fa-bolt gemini-icon"></i> <b>Gemini</b></p>
</footer>

</div>

<nav class="mobile-nav">
  <button onclick="openTab('ciencia')" id="btn-ciencia" class="active">
    <i class="fas fa-microscope" style="font-size: 16px; display: block; margin-bottom: 2px;"></i>
    Ciencia
  </button>
  <button onclick="openTab('tecnologia')" id="btn-tecnologia">
    <i class="fas fa-microchip" style="font-size: 16px; display: block; margin-bottom: 2px;"></i>
    Tech
  </button>
  <button onclick="openTab('videojuegos')" id="btn-videojuegos">
    <i class="fas fa-gamepad" style="font-size: 16px; display: block; margin-bottom: 2px;"></i>
    Juegos
  </button>
  <button onclick="openTab('cine')" id="btn-cine">
    <i class="fas fa-film" style="font-size: 16px; display: block; margin-bottom: 2px;"></i>
    Cine
  </button>
</nav>

<script>
// (Aquí va toda la lógica de JS que ya tenemos optimizada para 20 Minutos, Computer Hoy, etc.)
// ... (omito el script por brevedad pero es el mismo que el anterior)
</script>
</body>
</html>
