<!DOCTYPE html>
<html lang="es">
<head>
    <title>DAILY NEWS</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Raleway">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --text-dim: #b0b0b0;
            --border-color: #333;
            --header-ciencia: #0d47a1;
            --header-tech: #37474f;
            --header-juegos: #b71c1c;
            --header-cine: #000000;
        }

        body { background-color: var(--bg-color); color: var(--text-main); font-family: "Raleway", sans-serif; }
        h1,h2,h3,h4,h5,h6 { font-family: "Raleway", sans-serif; color: var(--text-main); }
        
        .feed-container { height: 750px; overflow-y: scroll; padding-right: 5px; background-color: var(--card-bg); }
        .feed-container::-webkit-scrollbar { width: 6px; }
        .feed-container::-webkit-scrollbar-track { background: #1e1e1e; }
        .feed-container::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }

        .feed-item { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border-color); }
        
        .feed-thumbnail-container { 
            flex: 0 0 85px; 
            height: 85px; 
            margin-right: 12px; 
            overflow: hidden; 
            border-radius: 4px; 
            background: #fff; 
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #333;
        }
        
        .feed-thumbnail-container img { max-width: 85%; max-height: 85%; object-fit: contain; }

        .feed-content-container { flex: 1; min-width: 0; }
        .feed-title { font-size: 14px; font-weight: bold; margin: 0 0 4px 0; line-height: 1.2; }
        .feed-title a { text-decoration: none; color: var(--text-main); }
        .feed-title a:hover { color: #64b5f6; }
        
        .feed-meta { 
            font-size: 10px; 
            color: var(--text-dim); 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            width: 100%;
            margin-top: 5px;
        }
        .source-tag { font-weight: 800; color: #90caf9; text-transform: uppercase; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        
        .w3-card-4 { background-color: var(--card-bg); border: 1px solid var(--border-color); box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .w3-container h3 { font-weight: bold; text-transform: uppercase; letter-spacing: 1px; color: white !important; margin: 15px 0; }
    </style>
</head>
<body>

<div class="w3-content" style="max-width:1800px">

<header class="w3-container w3-center w3-padding-48"> 
  <h1 style="font-weight: 900; letter-spacing: 3px;"><b>DAILY NEWS</b></h1>
  <hr style="border-top: 1px solid #333; width: 100px; margin: auto;">
</header>

<div class="w3-row-padding">
  <div class="w3-col l3 m6 w3-margin-bottom">
    <div class="w3-card-4">
      <div class="w3-container" style="background-color: var(--header-ciencia)"><h3 class="w3-center">Ciencia</h3></div>
      <div id="ciencia" class="w3-container feed-container"><p class="w3-padding">Cargando...</p></div>
    </div>
  </div>

  <div class="w3-col l3 m6 w3-margin-bottom">
    <div class="w3-card-4">
      <div class="w3-container" style="background-color: var(--header-tech)"><h3 class="w3-center">Tecnología</h3></div>
      <div id="tecnologia" class="w3-container feed-container"><p class="w3-padding">Cargando...</p></div>
    </div>
  </div>

  <div class="w3-col l3 m6 w3-margin-bottom">
    <div class="w3-card-4">
      <div class="w3-container" style="background-color: var(--header-juegos)"><h3 class="w3-center">Videojuegos</h3></div>
      <div id="videojuegos" class="w3-container feed-container"><p class="w3-padding">Cargando...</p></div>
    </div>
  </div>

  <div class="w3-col l3 m6 w3-margin-bottom">
    <div class="w3-card-4">
      <div class="w3-container" style="background-color: var(--header-cine)"><h3 class="w3-center">Cine y TV</h3></div>
      <div id="cine" class="w3-container feed-container"><p class="w3-padding">Cargando...</p></div>
    </div>
  </div>
</div>
</div>

<script>
const config = {
    ciencia: [
        "https://www.agenciasinc.es/feed/Ciencia",
        "https://news.google.com/rss/topics/CAAqLAgKIiZDQkFTRmdvSUwyMHZNRFp0Y1RjU0JtVnpMVFF4T1JvQ1VFVW9BQVAB?ceid=PE:es-419&oc=3"
    ],
    tecnologia: ["https://www.muycomputer.com/feed/"],
    videojuegos: ["https://www.3djuegos.com/feedburner.xml"],
    cine: ["https://www.espinof.com/feedburner.xml"]
};

const sourceData = {
    "SINC": { keywords: ["SINC", "AGENCIA SI"], name: "SINC", logo: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRgdzVETxx1l4z1lVDMKZCNIoeQaGUUVxbLNw&s" },
    "GOOGLE NEWS": { keywords: ["GOOGLE NEWS", "GOOGLE NOTICIAS"], name: "GOOGLE NEWS", logo: "https://upload.wikimedia.org/wikipedia/commons/0/0b/Google_News_icon.png" },
    "MUY COMPUTER": { keywords: ["MUYCOMPUTE", "MUYCOMPUTER"], name: "MUY COMPUTER", logo: "https://www.tpnet.es/wp-content/uploads/2018/09/mc-tecnologia-consumo-content-marketing-video-design-logo.png" },
    "3D JUEGOS": { keywords: ["3DJUEGOS"], name: "3D JUEGOS", logo: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT4TkCVZaSxmfU-e__gEatDsmp7U8QMTsIFug&s" },
    "ESPINOF": { keywords: ["ESPINOF"], name: "ESPINOF", logo: "https://yt3.googleusercontent.com/ytc/AIdro_mwyVcXPGLPElADFqCr5xP9g086XmBMYYYbOu9bVagVJc0=s900-c-k-c0x00ffffff-no-rj" }
};

function formatSmartDate(dateStr) {
    const newsDate = new Date(dateStr);
    const today = new Date();
    const yesterday = new Date();
    yesterday.setDate(today.getDate() - 1);
    const timeStr = newsDate.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
    if (newsDate.toDateString() === today.toDateString()) return `Hoy | ${timeStr}`;
    if (newsDate.toDateString() === yesterday.toDateString()) return `Ayer | ${timeStr}`;
    return `${newsDate.toLocaleDateString('es-ES')} | ${timeStr}`;
}

async function loadCategoryFeeds(urls, elementId) {
    let allItems = [];
    const fetchPromises = urls.map(url => 
        fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`)
        .then(res => res.json())
        .then(data => {
            if(data.status === 'ok') {
                return data.items.map(item => {
                    let rawSource = (data.feed.title || "").toUpperCase();
                    let finalName = "INFO";
                    let finalLogo = "https://via.placeholder.com/85/333/fff?text=NEWS";
                    let displayTitle = item.title;

                    if (rawSource.includes("GOOGLE NEWS") || rawSource.includes("GOOGLE NOTICIAS")) {
                        const titleParts = item.title.split(" - ");
                        if (titleParts.length > 1) {
                            finalName = titleParts.pop().trim().toUpperCase();
                            displayTitle = titleParts.join(" - ");
                        } else { finalName = "GOOGLE NEWS"; }
                        finalLogo = sourceData["GOOGLE NEWS"].logo;
                    } else {
                        for (let key in sourceData) {
                            if (sourceData[key].keywords.some(k => rawSource.includes(k))) {
                                finalName = sourceData[key].name;
                                finalLogo = sourceData[key].logo;
                                break;
                            }
                        }
                    }
                    return {...item, title: displayTitle, sourceName: finalName, staticLogo: finalLogo};
                });
            }
            return [];
        })
    );

    try {
        const results = await Promise.all(fetchPromises);
        allItems = results.flat().sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));
        const container = document.getElementById(elementId);
        let html = '';
        allItems.forEach(item => {
            html += `
                <div class="feed-item">
                    <div class="feed-thumbnail-container"><img src="${item.staticLogo}" alt="logo"></div>
                    <div class="feed-content-container">
                        <h6 class="feed-title"><a href="${item.link}" target="_blank">${item.title}</a></h6>
                        <div class="feed-meta"><span class="source-tag">${item.sourceName}</span><span>${formatSmartDate(item.pubDate)}</span></div>
                    </div>
                </div>`;
        });
        container.innerHTML = html || "<p class='w3-padding'>Sin noticias.</p>";
    } catch (err) { document.getElementById(elementId).innerHTML = "<p class='w3-padding'>Error de conexión.</p>"; }
}

window.onload = () => {
    loadCategoryFeeds(config.ciencia, 'ciencia');
    loadCategoryFeeds(config.tecnologia, 'tecnologia');
    loadCategoryFeeds(config.videojuegos, 'videojuegos');
    loadCategoryFeeds(config.cine, 'cine');
};
</script>
</body>
</html>
