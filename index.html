<!DOCTYPE html>
<html lang="es">
<head>
    <title>DAILY NEWS</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Raleway">
    <style>
        body,h1,h2,h3,h4,h5,h6 {font-family: "Raleway", sans-serif}
        .feed-container { height: 750px; overflow-y: scroll; padding-right: 5px; }
        .feed-item { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid #eee; }
        
        .feed-thumbnail-container { 
            flex: 0 0 85px; 
            height: 85px; 
            margin-right: 12px; 
            overflow: hidden; 
            border-radius: 4px; 
            background: #fff; 
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #f0f0f0;
        }
        
        .feed-thumbnail-container img { 
            max-width: 90%; 
            max-height: 90%; 
            object-fit: contain; 
        }

        .feed-content-container { flex: 1; min-width: 0; }
        .feed-title { font-size: 14px; font-weight: bold; margin: 0 0 4px 0; line-height: 1.2; }
        .feed-title a { text-decoration: none; color: #1a1a1a; }
        .feed-title a:hover { color: #2196F3; }
        
        .feed-meta { 
            font-size: 11px; 
            color: #666; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            width: 100%;
            margin-top: 5px;
        }
        .source-tag { font-weight: 800; color: #444; text-transform: uppercase; }
        .w3-container h3 { font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body class="w3-light-grey">

<div class="w3-content" style="max-width:1800px">

<header class="w3-container w3-center w3-padding-48"> 
  <h1 style="font-weight: 900; letter-spacing: 2px;"><b>DAILY NEWS</b></h1>
</header>

<div class="w3-row-padding">
  <div class="w3-col l3 m6 w3-margin-bottom">
    <div class="w3-card-4 w3-white">
      <div class="w3-container w3-blue"><h3 class="w3-center">Ciencia</h3></div>
      <div id="ciencia" class="w3-container feed-container"><p class="w3-padding">Cargando...</p></div>
    </div>
  </div>

  <div class="w3-col l3 m6 w3-margin-bottom">
    <div class="w3-card-4 w3-white">
      <div class="w3-container w3-dark-grey"><h3 class="w3-center">Tecnología</h3></div>
      <div id="tecnologia" class="w3-container feed-container"><p class="w3-padding">Cargando...</p></div>
    </div>
  </div>

  <div class="w3-col l3 m6 w3-margin-bottom">
    <div class="w3-card-4 w3-white">
      <div class="w3-container w3-red"><h3 class="w3-center">Videojuegos</h3></div>
      <div id="videojuegos" class="w3-container feed-container"><p class="w3-padding">Cargando...</p></div>
    </div>
  </div>

  <div class="w3-col l3 m6 w3-margin-bottom">
    <div class="w3-card-4 w3-white">
      <div class="w3-container w3-black"><h3 class="w3-center">Cine y TV</h3></div>
      <div id="cine" class="w3-container feed-container"><p class="w3-padding">Cargando...</p></div>
    </div>
  </div>
</div>

</div>

<script>
const config = {
    ciencia: ["https://www.agenciasinc.es/feed/Ciencia"],
    tecnologia: ["https://www.muycomputer.com/feed/"],
    videojuegos: ["https://www.3djuegos.com/feedburner.xml"],
    cine: ["https://www.espinof.com/feedburner.xml"]
};

const sourceData = {
    "SINC": { keywords: ["AGENCIA SI", "SINC"], name: "SINC", logo: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRgdzVETxx1l4z1lVDMKZCNIoeQaGUUVxbLNw&s" },
    "MUY COMPUTER": { keywords: ["MUYCOMPUTE", "MUYCOMPUTER"], name: "MUY COMPUTER", logo: "https://www.tpnet.es/wp-content/uploads/2018/09/mc-tecnologia-consumo-content-marketing-video-design-logo.png" },
    "3D JUEGOS": { keywords: ["3DJUEGOS"], name: "3D JUEGOS", logo: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT4TkCVZaSxmfU-e__gEatDsmp7U8QMTsIFug&s" },
    "ESPINOF": { keywords: ["ESPINOF"], name: "ESPINOF", logo: "https://yt3.googleusercontent.com/ytc/AIdro_mwyVcXPGLPElADFqCr5xP9g086XmBMYYYbOu9bVagVJc0=s900-c-k-c0x00ffffff-no-rj" }
};

// Función para formatear la fecha a "Hoy", "Ayer" o fecha estándar
function formatSmartDate(dateStr) {
    const newsDate = new Date(dateStr);
    const today = new Date();
    const yesterday = new Date();
    yesterday.setDate(today.getDate() - 1);

    const timeStr = newsDate.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });

    if (newsDate.toDateString() === today.toDateString()) {
        return `Hoy | ${timeStr}`;
    } else if (newsDate.toDateString() === yesterday.toDateString()) {
        return `Ayer | ${timeStr}`;
    } else {
        return `${newsDate.toLocaleDateString('es-ES')} | ${timeStr}`;
    }
}

async function loadCategoryFeeds(urls, elementId) {
    let allItems = [];
    
    const fetchPromises = urls.map(url => 
        fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`)
        .then(res => res.json())
        .then(data => {
            if(data.status === 'ok') {
                return data.items.map(item => {
                    let rawName = data.feed.title || "Fuente";
                    let finalName = rawName;
                    let finalLogo = "https://via.placeholder.com/85?text=NEWS";

                    for (let key in sourceData) {
                        const match = sourceData[key].keywords.some(k => rawName.toUpperCase().includes(k));
                        if (match) {
                            finalName = sourceData[key].name;
                            finalLogo = sourceData[key].logo;
                            break;
                        }
                    }
                    return {...item, sourceName: finalName, staticLogo: finalLogo};
                });
            }
            return [];
        })
    );

    try {
        const results = await Promise.all(fetchPromises);
        allItems = results.flat();
        allItems.sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));

        const container = document.getElementById(elementId);
        let html = '';
        
        allItems.forEach(item => {
            html += `
                <div class="feed-item">
                    <div class="feed-thumbnail-container">
                        <img src="${item.staticLogo}" alt="${item.sourceName}">
                    </div>
                    <div class="feed-content-container">
                        <h6 class="feed-title">
                            <a href="${item.link}" target="_blank">${item.title}</a>
                        </h6>
                        <div class="feed-meta">
                            <span class="source-tag">${item.sourceName}</span>
                            <span>${formatSmartDate(item.pubDate)}</span>
                        </div>
                    </div>
                </div>`;
        });
        container.innerHTML = html;
    } catch (err) {
        document.getElementById(elementId).innerHTML = "<p class='w3-padding'>Error de conexión.</p>";
    }
}

window.onload = () => {
    loadCategoryFeeds(config.ciencia, 'ciencia');
    loadCategoryFeeds(config.tecnologia, 'tecnologia');
    loadCategoryFeeds(config.videojuegos, 'videojuegos');
    loadCategoryFeeds(config.cine, 'cine');
};
</script>

</body>
</html>
