<!DOCTYPE html>
<html lang="es">
<head>
    <title>DAILY NEWS | PREMIUM</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Raleway">
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: rgba(30, 30, 30, 0.6);
            --text-main: #f0f0f0;
            --text-dim: #999;
            --accent-blue: #007bff;
            --accent-tech: #4caf50;
            --accent-juegos: #f44336;
            --accent-cine: #ffc107;
        }

        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            font-family: "Raleway", sans-serif; 
            margin-bottom: 70px;
        }
        
        /* Gradientes de fondo por columna */
        #col-ciencia { background: linear-gradient(180deg, rgba(13, 71, 161, 0.2) 0%, transparent 100%); }
        #col-tecnologia { background: linear-gradient(180deg, rgba(55, 71, 79, 0.2) 0%, transparent 100%); }
        #col-videojuegos { background: linear-gradient(180deg, rgba(183, 28, 28, 0.2) 0%, transparent 100%); }
        #col-cine { background: linear-gradient(180deg, rgba(30, 30, 30, 0.5) 0%, transparent 100%); }

        .feed-container { 
            height: 78vh; 
            overflow-y: scroll; 
            padding: 10px; 
            background-color: var(--card-bg);
            border-radius: 0 0 8px 8px;
            backdrop-filter: blur(10px);
        }

        .feed-container::-webkit-scrollbar { width: 3px; }
        .feed-container::-webkit-scrollbar-thumb { background: #333; }

        /* Estilo de la noticia */
        .feed-item { 
            display: flex; 
            align-items: center; 
            padding: 15px 10px; 
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: transform 0.2s ease;
        }
        .feed-item:hover { background: rgba(255,255,255,0.03); transform: translateX(5px); }
        
        .feed-thumbnail-container { 
            flex: 0 0 55px; height: 55px; margin-right: 15px; 
            overflow: hidden; border-radius: 50%; background: #fff; 
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
        .feed-thumbnail-container img { max-width: 70%; max-height: 70%; object-fit: contain; }

        .feed-title { font-size: 13px; font-weight: 700; margin: 0; line-height: 1.3; }
        .feed-title a { text-decoration: none; color: var(--text-main); }
        
        .feed-meta { font-size: 10px; color: var(--text-dim); margin-top: 6px; display: flex; justify-content: space-between; }
        .source-tag { font-weight: 900; color: #fff; opacity: 0.8; letter-spacing: 0.5px; }

        /* SKELETON LOADING ANIMATION */
        .skeleton {
            background: #1e1e1e;
            background: linear-gradient(90deg, #1e1e1e 25%, #2a2a2a 50%, #1e1e1e 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: 4px;
        }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        .sk-item { display: flex; padding: 15px 10px; }
        .sk-circle { width: 55px; height: 55px; border-radius: 50%; margin-right: 15px; }
        .sk-line { flex: 1; height: 12px; margin-bottom: 8px; }

        header h1 { font-weight: 900; letter-spacing: 5px; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }

        /* Navegación móvil corregida */
        .mobile-nav { display: none; position: fixed; bottom: 0; width: 100%; background: #000; z-index: 1000; }
        .mobile-nav button { flex: 1; padding: 20px 0; border: none; background: none; color: #666; font-size: 10px; font-weight: bold; }
        .mobile-nav button.active { color: #fff; background: rgba(255,255,255,0.1); }

        @media (max-width: 992px) {
            .mobile-nav { display: flex; }
            .category-col { display: none; } 
            .category-col.active { display: block; }
        }
    </style>
</head>
<body>

<header class="w3-container w3-center w3-padding-32"> 
  <h1><b>DAILY NEWS</b></h1>
</header>

<div class="w3-row-padding" style="max-width: 1800px; margin: auto;">
  <div id="col-ciencia" class="w3-col l3 m12 category-col active w3-margin-bottom">
    <div class="w3-container w3-blue-grey w3-center" style="border-radius: 8px 8px 0 0"><h3>Ciencia</h3></div>
    <div id="ciencia" class="feed-container"></div>
  </div>

  <div id="col-tecnologia" class="w3-col l3 m12 category-col w3-margin-bottom">
    <div class="w3-container w3-grey w3-center" style="border-radius: 8px 8px 0 0"><h3>Tecnología</h3></div>
    <div id="tecnologia" class="feed-container"></div>
  </div>

  <div id="col-videojuegos" class="w3-col l3 m12 category-col w3-margin-bottom">
    <div class="w3-container w3-red w3-center" style="border-radius: 8px 8px 0 0"><h3>Videojuegos</h3></div>
    <div id="videojuegos" class="feed-container"></div>
  </div>

  <div id="col-cine" class="w3-col l3 m12 category-col w3-margin-bottom">
    <div class="w3-container w3-black w3-center" style="border-radius: 8px 8px 0 0"><h3>Cine y TV</h3></div>
    <div id="cine" class="feed-container"></div>
  </div>
</div>

<nav class="mobile-nav">
  <button onclick="openTab('ciencia')" id="btn-ciencia" class="active">CIENCIA</button>
  <button onclick="openTab('tecnologia')" id="btn-tecnologia">TECH</button>
  <button onclick="openTab('videojuegos')" id="btn-videojuegos">GAMES</button>
  <button onclick="openTab('cine')" id="btn-cine">CINE</button>
</nav>

<script>
const config = {
    ciencia: ["https://www.agenciasinc.es/feed/Ciencia", "https://naukas.com/feed", "https://feeds.elpais.com/mrss-s/pages/ep/site/elpais.com/section/ciencia/portada"],
    tecnologia: ["https://www.xataka.com/feedburner.xml", "https://www.elespanol.com/rss/omicrono/", "https://computerhoy.20minutos.es/rss/"],
    videojuegos: ["https://www.3djuegos.com/feedburner.xml", "https://vandal.elespanol.com/xml.cgi", "https://es.ign.com/feed.xml", "https://www.hobbyconsolas.com/rss/"],
    cine: ["https://www.espinof.com/feedburner.xml", "https://www.20minutos.es/rss/cinemania/", "https://www.formulatv.com/xml/formulatv.xml", "https://feeds.feedburner.com/hello_friki"]
};

// Generar skeleton screens al inicio
function showSkeletons() {
    const skeletonHTML = Array(6).fill(`
        <div class="sk-item">
            <div class="sk-circle skeleton"></div>
            <div style="flex:1">
                <div class="sk-line skeleton" style="width:90%"></div>
                <div class="sk-line skeleton" style="width:40%"></div>
            </div>
        </div>
    `).join('');
    document.querySelectorAll('.feed-container').forEach(c => c.innerHTML = skeletonHTML);
}

function openTab(cat) {
    if (window.innerWidth > 992) return;
    document.querySelectorAll(".category-col").forEach(c => c.classList.remove("active"));
    document.querySelectorAll(".mobile-nav button").forEach(b => b.classList.remove("active"));
    document.getElementById("col-" + cat).classList.add("active");
    document.getElementById("btn-" + cat).classList.add("active");
}

async function loadFeeds(urls, elementId) {
    let allItems = [];
    const fetchPromises = urls.map(url => 
        fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`)
        .then(res => res.json())
        .then(data => {
            if(data.status === 'ok') {
                return data.items.map(item => ({
                    ...item,
                    source: data.feed.title.split(' ')[0].toUpperCase()
                }));
            }
            return [];
        })
    );

    const results = await Promise.all(fetchPromises);
    allItems = results.flat().sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));
    
    const container = document.getElementById(elementId);
    container.innerHTML = allItems.map(item => `
        <div class="feed-item">
            <div class="feed-thumbnail-container">
                <img src="https://www.google.com/s2/favicons?sz=64&domain=${new URL(item.link).hostname}" alt="icon">
            </div>
            <div style="flex:1">
                <h6 class="feed-title"><a href="${item.link}" target="_blank">${item.title}</a></h6>
                <div class="feed-meta">
                    <span class="source-tag">${item.source}</span>
                    <span>${new Date(item.pubDate).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                </div>
            </div>
        </div>
    `).join('');
}

window.onload = () => {
    showSkeletons();
    // Un pequeño delay para que se aprecie el skeleton si la conexión es muy rápida
    setTimeout(() => {
        Object.keys(config).forEach(cat => loadFeeds(config[cat], cat));
    }, 800);
};
</script>
</body>
</html>
